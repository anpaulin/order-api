play.http.errorHandler = "controllers.ErrorHandler"

# Secret key used for cryptographic operations (signing session cookies, CSRF tokens, etc.)
play.http.secret.key = "changeme-askuity-sample-order-service-secret-key-at-least-32-chars-long"
play.http.secret.key = ${?APPLICATION_SECRET}
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}


app {
  audit-log {
    # Supported values: "file", "memory", "kafka", "mysql"
    type = "file"
    type = ${?AUDIT_LOG_TYPE}

    file-path = "./data/audit.log"
    file-path = ${?AUDIT_LOG_FILE_PATH}

    kafka {
      bootstrap-servers = "localhost:9092"
      bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
      topic = "order-audit-events"
      topic = ${?KAFKA_AUDIT_TOPIC}
    }

    mysql {
      url = "jdbc:mysql://localhost:3306/order_db"
      url = ${?MYSQL_AUDIT_URL}
      table = "audit_logs"
      table = ${?MYSQL_AUDIT_TABLE}
    }
  }

  startup {
    replay-audit = true
    replay-audit = ${?REPLAY_AUDIT_ON_STARTUP}
  }

  blocking-io-dispatcher {
    executor = "thread-pool-executor"
    throughput = 1
    thread-pool-executor {
      fixed-pool-size = 16
    }
  }
}


